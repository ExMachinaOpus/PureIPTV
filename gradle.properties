# Kept lean so a build plus one emulator fits in 16 GB (see dev/dev-setup.md, "Memory budget").
# Gradle daemon: 2 GB heap. Kotlin compiles inside it instead of a second ~1.5 GB JVM.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.configuration-cache=true
# Don't keep an idle 2 GB daemon around for hours (default is 3 h).
org.gradle.daemon.idletimeout=900000
android.useAndroidX=true
kotlin.code.style=official
